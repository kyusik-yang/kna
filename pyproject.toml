[project]
name = "kna"
version = "0.8.1"
description = "Comprehensive CLI for the Korean National Assembly: bills, lifecycle, votes, ideal points, and bill texts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kyusik Yang", email = "kyusik.yang@nyu.edu" }]
keywords = ["korean", "national-assembly", "legislative", "bills", "nominate", "dw-nominate", "korea", "parliament"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "click>=8.0",
    "pandas>=1.5",
    "pyarrow>=10.0",
    "rich>=12.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# collect_minutes_votes.py: download the plenary minutes and parse them
# (PyMuPDF reads the PDFs, hanja reads Hanja bill titles)
minutes = ["requests", "pymupdf", "hanja"]
# build_assets.py: fetch and parse the 국회공보 asset disclosure PDFs
assets = ["requests", "pdfplumber"]

[project.urls]
Homepage = "https://github.com/kyusik-yang/kna"
Documentation = "https://kyusik-yang.github.io/assembly-tutorial/"
Explorer = "https://kyusik-yang.github.io/kna/"
Issues = "https://github.com/kyusik-yang/kna/issues"

[project.scripts]
kna = "kna.cli:cli"

[tool.hatch.build.targets.sdist]
# The data lives in the Git repository (via Git LFS), not in the Python
# package. Without this the sdist bundles ~200MB of parquet and sqlite.
include = [
  "kna/",
  "README.md",
  "CODEBOOK.md",
  "CORRECTIONS.md",
  "DATA_AVAILABILITY.md",
  "pyproject.toml",
  "*.py",
  "*.R",
  # Named explicitly so they stay in the sdist if the globs above are narrowed:
  # the shared API client and the 2026-09 structural-data scripts.
  "kna_api.py",
  "collect_structure.py",
  "build_structure.py",
  "tests/",
]

[tool.hatch.build.targets.wheel]
packages = ["kna"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
